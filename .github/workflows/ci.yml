name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore JournalT.slnx

      - name: Build
        run: dotnet build JournalT.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test JournalT.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Test & Build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build
