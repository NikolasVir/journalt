name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore JournalT.slnx

      - name: Build
        run: dotnet build JournalT.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test JournalT.slnx --no-build --configuration Release --verbosity normal
