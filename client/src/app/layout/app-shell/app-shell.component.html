<div class="shell">
  <app-header />
  <div class="shell__body">
    @if (!layoutService.isSidebarHidden()) {
      <app-sidebar />
    }
    <main
      class="shell__content"
      [class.shell__content--fullbleed]="layoutService.isSidebarHidden()"
      id="main-content"
      tabindex="-1"
    >
      <router-outlet />
    </main>
  </div>
</div>
