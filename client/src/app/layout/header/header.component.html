<mat-toolbar class="header-toolbar">
  <div class="header-toolbar__left">
    <button
      mat-icon-button
      (click)="layoutService.toggleSidebar()"
      matTooltip="Main menu"
      aria-label="Toggle navigation"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a routerLink="/dashboard" class="header-toolbar__brand">
      <span class="header-toolbar__title">JournalT</span>
    </a>
  </div>

  <div class="header-toolbar__search">
    <div class="search-box">
      <mat-icon class="search-box__icon">search</mat-icon>
      <input
        type="text"
        class="search-box__input"
        placeholder="Search"
        [value]="layoutService.searchQuery()"
        (input)="onSearchInput($event)"
        aria-label="Search"
      />
      @if (layoutService.searchQuery().length > 0) {
        <button
          mat-icon-button
          class="search-box__clear-btn"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  </div>

  <div class="header-toolbar__right">
    @if (authService.currentUser(); as user) {
      <span class="header-toolbar__username">{{ user.userName || user.email }}</span>
    }
    <button
      mat-icon-button
      type="button"
      (click)="themeService.toggleTheme()"
      [matTooltip]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <a
      mat-icon-button
      routerLink="/settings"
      matTooltip="Settings"
      aria-label="Settings"
    >
      <mat-icon>settings</mat-icon>
    </a>
    <button
      mat-icon-button
      (click)="onLogout()"
      matTooltip="Sign out"
      aria-label="Sign out"
    >
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>
