@if (note(); as n) {
  <div class="dialog-backdrop" (click)="onBackdropClick($event)">
    <div class="dialog-panel" role="dialog" aria-modal="true" [attr.aria-label]="n.title">
      <div class="dialog-panel__header">
        <mat-form-field appearance="outline" class="dialog-panel__title-field" subscriptSizing="dynamic">
          <input
            matInput
            placeholder="Title"
            [value]="editTitle()"
            (input)="onTitleInput($event)"
          />
        </mat-form-field>
        <span class="dialog-panel__level-badge" [class]="'dialog-panel__level-badge--' + n.level.toLowerCase()">
          {{ n.level }}
        </span>
      </div>

      <div class="dialog-panel__body">
        <mat-form-field appearance="outline" class="dialog-panel__body-field">
          <textarea
            matInput
            rows="8"
            placeholder="Note content (Markdown supported)..."
            [value]="editBody()"
            (input)="onBodyInput($event)"
          ></textarea>
        </mat-form-field>

        @if (n.level !== 'Inbox') {
          <mat-form-field appearance="outline" class="dialog-panel__tags-field" subscriptSizing="dynamic">
            <mat-label>Tags</mat-label>
            <input
              matInput
              placeholder="Comma-separated tags..."
              [value]="editTags()"
              (input)="onTagsInput($event)"
            />
          </mat-form-field>
        }
      </div>

      <div class="dialog-panel__actions">
        <div class="dialog-panel__action-group">
          <button
            mat-icon-button
            [color]="editIsTodo() ? 'primary' : undefined"
            (click)="toggleTodo()"
            [matTooltip]="editIsTodo() ? 'Unmark Todo' : 'Mark as Todo'"
            aria-label="Toggle Todo"
          >
            <mat-icon>{{ editIsTodo() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
          </button>

          @if (nextPromoteLevel; as nextLevel) {
            <button
              mat-button
              (click)="onPromote()"
              [matTooltip]="'Promote to ' + nextLevel"
            >
              <mat-icon>arrow_upward</mat-icon>
              <span>Promote to {{ nextLevel }}</span>
            </button>
          }

          <button
            mat-icon-button
            (click)="onTrash()"
            matTooltip="Delete note"
            aria-label="Delete note"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>

        <button
          mat-button
          type="button"
          (click)="onClose()"
        >
          Close
        </button>
      </div>
    </div>
  </div>
}
